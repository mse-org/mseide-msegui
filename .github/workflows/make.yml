name: Make

on:
  schedule:
    - cron:  '0 0 1 * *'
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: freebsd
          - os: ubuntu-latest
            target: rpi-arm
          - os: ubuntu-latest
            target: rpi-aarch64

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    # --- LINUX COMPILATION TARGET ---
    - name: Build on Linux
      if: matrix.target == 'linux'
      shell: bash
      run: |
        set -xeuo pipefail
        sudo bash -c '
          apt-get update; apt-get -y install fpc
        ' >/dev/null
        fpc -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    # --- WINDOWS COMPILATION TARGET ---
    - name: Install Lazarus/FPC on Windows
      if: matrix.target == 'windows'
      uses: gcarreno/setup-lazarus@v3
      with:
        lazarus-version: stable

    - name: Add FPC binary path to Bash environment on Windows
      if: matrix.target == 'windows'
      shell: bash
      run: |
        FPC_DIR=$(find /c/ -maxdepth 4 -type d -name "i386-win32" -o -name "x86_64-win64" 2>/dev/null | head -n 1)
        if [ -n "$FPC_DIR" ]; then
          echo "$FPC_DIR" >> $GITHUB_PATH
        fi

    - name: Build on Windows
      if: matrix.target == 'windows'
      shell: bash
      run: |
        set -xeuo pipefail
        fpc -Fulib/common/* -Fulib/common/kernel/windows apps/ide/mseide.pas

    # --- FREEBSD COMPILATION TARGET ---
    - name: Build on FreeBSD
      if: matrix.target == 'freebsd'
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        prepare: |
          pkg update
          pkg install -y fpc libX11 libXext
        run: |
          fpc -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    # --- RASPBERRY PI ARM (32-bit) COMPILATION TARGET ---
    - name: Build on RPi ARM (32-bit)
      if: matrix.target == 'rpi-arm'
      shell: bash
      run: |
        set -xeuo pipefail
        # Install the main compiler, target cross-linkers, and fpc source package
        sudo bash -c '
          apt-get update; apt-get -y install fpc fpc-source binutils-arm-linux-gnueabihf
        ' >/dev/null
        
        # Build the missing cross-compiler binary (ppcarm) and target RTL components from source
        cd /usr/share/fpcsrc/*
        sudo fpc -iV | read -r FPC_VERSION
        sudo make crossall crossinstall CPU_TARGET=arm OS_TARGET=linux CROSSBINDIR=/usr/bin
        sudo ln -sf /usr/lib/fpc/$(fpc -iV)/ppcrossarm /usr/bin/ppcarm
        
        # Run compilation back in workspace
        cd $GITHUB_WORKSPACE
        fpc -Parm -Tlinux -XParm-linux-gnueabihf- -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    # --- RASPBERRY PI AARCH64 (64-bit) COMPILATION TARGET ---
    - name: Build on RPi AArch64 (64-bit)
      if: matrix.target == 'rpi-aarch64'
      shell: bash
      run: |
        set -xeuo pipefail
        # Install the main compiler, target cross-linkers, and fpc source package
        sudo bash -c '
          apt-get update; apt-get -y install fpc fpc-source binutils-aarch64-linux-gnu
        ' >/dev/null
        
        # Build the missing cross-compiler binary (ppcaarch64) and target RTL components from source
        cd /usr/share/fpcsrc/*
        sudo make crossall crossinstall CPU_TARGET=aarch64 OS_TARGET=linux CROSSBINDIR=/usr/bin
        sudo ln -sf /usr/lib/fpc/$(fpc -iV)/ppcrossaarch64 /usr/bin/ppcaarch64
        
        # Run compilation back in workspace
        cd $GITHUB_WORKSPACE
        fpc -Paarch64 -Tlinux -XPaarch64-linux-gnu- -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas
