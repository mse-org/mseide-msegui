name: Make Ultimate Matrix

on:
  schedule:
    - cron:  '0 0 1 * *'
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- LINUX TARGETS ---
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-latest
            target: linux-i386
          - os: ubuntu-latest
            target: linux-rpi-arm32
          - os: ubuntu-latest
            target: linux-rpi-aarch64

          # --- WINDOWS TARGETS ---
          - os: windows-latest
            target: windows-x86_64
          - os: windows-latest
            target: windows-i386

          # --- FREEBSD TARGETS ---
          - os: ubuntu-latest
            target: freebsd-x86_64
          - os: ubuntu-latest
            target: freebsd-aarch64

          # --- MACOS (DARWIN) TARGETS ---
          - os: macos-latest
            target: darwin-macos-x86_64
          - os: macos-latest
            target: darwin-macos-aarch64

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    # ==========================================
    # 1. LINUX HOST BUILD STEPS
    # ==========================================
    - name: Build on Linux x86_64
      if: matrix.target == 'linux-x86_64'
      run: |
        sudo apt-get update && sudo apt-get -y install fpc
        fpc -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

        - name: Build on Linux i386
      if: matrix.target == 'linux-i386'
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        # Installs the cross-compilation target units and multiarch libraries instead of the broken i386 binary package
        sudo apt-get -y install fpc fp-units-i386 gcc-multilib libx11-6:i386 libxext6:i386
        
        # Link the compiler path to discover the internal i386 target utilities
        sudo ln -sf /usr/lib/fpc/$(fpc -iV)/ppcross386 /usr/bin/ppc386
        
        fpc -Pi386 -Tlinux -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    # ==========================================
    # 2. RASPBERRY PI EMULATED BUILD STEPS
    # ==========================================
    - name: Cache ARM32 OS Container Environment
      if: matrix.target == 'linux-rpi-arm32'
      uses: actions/cache@v4
      with:
        path: ~/.run-on-arch-cache
        key: run-on-arch-cache-armv7-v1

    - name: Build on Linux RPi ARM32
      if: matrix.target == 'linux-rpi-arm32'
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: armv7
        distro: ubuntu_latest
        githubToken: ${{ github.token }}
        run: |
          if ! command -v fpc &> /dev/null; then apt-get update && apt-get install -y fpc; fi
          fpc -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    - name: Cache AArch64 OS Container Environment
      if: matrix.target == 'linux-rpi-aarch64'
      uses: actions/cache@v4
      with:
        path: ~/.run-on-arch-cache
        key: run-on-arch-cache-aarch64-v1

    - name: Build on Linux RPi AArch64
      if: matrix.target == 'linux-rpi-aarch64'
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: aarch64
        distro: ubuntu_latest
        githubToken: ${{ github.token }}
        run: |
          if ! command -v fpc &> /dev/null; then apt-get update && apt-get install -y fpc; fi
          fpc -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    # ==========================================
    # 3. WINDOWS HOST BUILD STEPS
    # ==========================================
    - name: Install Lazarus/FPC on Windows (64-bit)
      if: matrix.target == 'windows-x86_64'
      uses: gcarreno/setup-lazarus@v3
      with:
        lazarus-version: stable

    - name: Install Lazarus/FPC on Windows (32-bit)
      if: matrix.target == 'windows-i386'
      uses: gcarreno/setup-lazarus@v3
      with:
        lazarus-version: stable
        include-cross-builder: true

    - name: Add FPC binary path to Bash environment on Windows
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        FPC_DIR=$(find /c/ -maxdepth 4 -type d -name "i386-win32" -o -name "x86_64-win64" 2>/dev/null | head -n 1)
        if [ -n "$FPC_DIR" ]; then echo "$FPC_DIR" >> $GITHUB_PATH; fi

    - name: Build on Windows Targets
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        if [ "${{ matrix.target }}" = "windows-i386" ]; then
          fpc -Pi386 -Twin32 -Fulib/common/* -Fulib/common/kernel/windows apps/ide/mseide.pas
        else
          fpc -Px86_64 -Twin64 -Fulib/common/* -Fulib/common/kernel/windows apps/ide/mseide.pas
        fi

    # ==========================================
    # 4. FREEBSD VIRTUAL BUILD STEPS
    # ==========================================
    - name: Build on FreeBSD x86_64
      if: matrix.target == 'freebsd-x86_64'
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        prepare: pkg update && pkg install -y fpc libX11 libXext
        run: fpc -Tfreebsd -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

        # --- FREEBSD AARCH64 COMPILATION TARGET ---
    - name: Build on FreeBSD aarch64
      if: matrix.target == 'freebsd-aarch64'
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        arch: aarch64
        sync: nfs # Added: Bypasses the rsync network failure over the virtual bridge
        prepare: pkg update && pkg install -y fpc libX11 libXext
        run: fpc -Tfreebsd -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    # ==========================================
    # 5. MACOS (DARWIN) HOST BUILD STEPS
    # ==========================================
    - name: Install FPC and X11 Dependencies on macOS Host
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install fpc xquartz fontconfig
        echo "/opt/homebrew/bin" >> $GITHUB_PATH
        echo "/usr/local/bin" >> $GITHUB_PATH

        - name: Build on Darwin macOS Targets
      if: matrix.os == 'macos-latest'
      run: |
        export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
        
        if [ "${{ matrix.target }}" = "darwin-macos-x86_64" ]; then
          # 1. Download and extract the Free Pascal source tree to generate cross-units
          wget -q "https://heanet.ie" -o fpc-src.tar.gz
          tar -xzf fpc-cross.tar.gz || tar -xzf fpc-src.tar.gz
          cd fpc-3.2.2
          
          # 2. Build and link the missing ppcx64 Intel cross-compiler using the native host toolchain
          sudo make crossall crossinstall CPU_TARGET=x86_64 OS_TARGET=darwin
          sudo ln -sf /usr/local/lib/fpc/3.2.2/ppcrossx64 /opt/homebrew/bin/ppcx64
          
          # 3. Return to workspace and execute your standard x86_64 build layout
          cd $GITHUB_WORKSPACE
          ppcx64 -Tdarwin -Fl/opt/X11/lib -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas
        else
          # Native Apple Silicon compilation targets run directly out of the box
          fpc -Paarch64 -Tdarwin -Fl/opt/X11/lib -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas
        fi
