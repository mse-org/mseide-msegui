name: Make

on:
  schedule:
    - cron:  '0 0 1 * *'
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive # Replaces 'true' with 'recursive' to guarantee nested dependencies resolve cleanly

    - name: Install Lazarus/FPC on Windows
      if: runner.os == 'Windows'
      uses: gcarreno/setup-lazarus@v3
      with:
        lazarus-version: stable

    - name: Add FPC binary path to Bash environment on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        FPC_DIR=$(find /c/ -maxdepth 4 -type d -name "i386-win32" -o -name "x86_64-win64" 2>/dev/null | head -n 1)
        if [ -n "$FPC_DIR" ]; then
          echo "$FPC_DIR" >> $GITHUB_PATH
        fi

    - name: Build on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -xeuo pipefail
        sudo bash -c '
          apt-get update; apt-get -y install lazarus
        ' >/dev/null
        fpc -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    - name: Build on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -xeuo pipefail
        # Compiles the executable targeting the native Windows GDI kernel library architecture
        fpc -Fulib/common/* -Fulib/common/kernel/windows apps/ide/mseide.pas
