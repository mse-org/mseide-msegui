name: Make Ultimate Matrix

on:
  schedule:
    - cron:  '0 0 1 * *'
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- LINUX TARGETS ---
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-latest
            target: linux-i386
          - os: ubuntu-latest
            target: linux-rpi-arm32
          - os: ubuntu-latest
            target: linux-rpi-aarch64

          # --- WINDOWS TARGETS ---
          - os: windows-latest
            target: windows-x86_64
          - os: windows-latest
            target: windows-i386

          # --- FREEBSD TARGETS ---
          - os: ubuntu-latest
            target: freebsd-x86_64
          - os: ubuntu-latest
            target: freebsd-aarch64

          # --- NETBSD TARGETS ---
          - os: ubuntu-latest
            target: netbsd-x86_64
          - os: ubuntu-latest
            target: netbsd-i386

          # --- OPENBSD TARGETS ---
          - os: ubuntu-latest
            target: openbsd-x86_64

          # --- MACOS (DARWIN) TARGETS ---
          - os: macos-latest
            target: darwin-macos-x86_64
          - os: macos-latest
            target: darwin-macos-aarch64

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    # ==========================================
    # 1. LINUX HOST BUILD STEPS
    # ==========================================
    - name: Build on Linux x86_64
      if: matrix.target == 'linux-x86_64'
      run: |
        sudo apt-get update && sudo apt-get -y install fpc
        fpc -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    - name: Build on Linux i386
      if: matrix.target == 'linux-i386'
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update && sudo apt-get -y install fpc gcc-multilib libx11-6:i386 libxext6:i386
        fpc -Pi386 -Tlinux -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    # ==========================================
    # 2. RASPBERRY PI EMULATED BUILD STEPS
    # ==========================================
    - name: Cache ARM32 OS Container Environment
      if: matrix.target == 'linux-rpi-arm32'
      uses: actions/cache@v4
      with:
        path: ~/.run-on-arch-cache
        key: run-on-arch-cache-armv7-v1

    - name: Build on Linux RPi ARM32
      if: matrix.target == 'linux-rpi-arm32'
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: armv7
        distro: ubuntu_latest
        githubToken: ${{ github.token }}
        run: |
          if ! command -v fpc &> /dev/null; then apt-get update && apt-get install -y fpc; fi
          fpc -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    - name: Cache AArch64 OS Container Environment
      if: matrix.target == 'linux-rpi-aarch64'
      uses: actions/cache@v4
      with:
        path: ~/.run-on-arch-cache
        key: run-on-arch-cache-aarch64-v1

    - name: Build on Linux RPi AArch64
      if: matrix.target == 'linux-rpi-aarch64'
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: aarch64
        distro: ubuntu_latest
        githubToken: ${{ github.token }}
        run: |
          if ! command -v fpc &> /dev/null; then apt-get update && apt-get install -y fpc; fi
          fpc -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    # ==========================================
    # 3. WINDOWS HOST BUILD STEPS
    # ==========================================
    - name: Install Lazarus/FPC on Windows
      if: matrix.os == 'windows-latest'
      uses: gcarreno/setup-lazarus@v3
      with:
        lazarus-version: stable

    - name: Add FPC binary path to Bash environment on Windows
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        FPC_DIR=$(find /c/ -maxdepth 4 -type d -name "i386-win32" -o -name "x86_64-win64" 2>/dev/null | head -n 1)
        if [ -n "$FPC_DIR" ]; then echo "$FPC_DIR" >> $GITHUB_PATH; fi

    - name: Build on Windows Targets
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        if [ "${{ matrix.target }}" = "windows-i386" ]; then
          fpc -Pi386 -Twin32 -Fulib/common/* -Fulib/common/kernel/windows apps/ide/mseide.pas
        else
          fpc -Px86_64 -Twin64 -Fulib/common/* -Fulib/common/kernel/windows apps/ide/mseide.pas
        fi

    # ==========================================
    # 4. FREEBSD VIRTUAL BUILD STEPS
    # ==========================================
    - name: Build on FreeBSD Layouts
      if: startsWith(matrix.target, 'freebsd-')
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        prepare: |
          pkg update
          pkg install -y fpc libX11 libXext
        run: |
          if [ "${{ matrix.target }}" = "freebsd-aarch64" ]; then
            fpc -Paarch64 -Tfreebsd -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas
          else
            fpc -Tfreebsd -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas
          fi

    # ==========================================
    # 5. NETBSD VIRTUAL BUILD STEPS
    # ==========================================
    - name: Build on NetBSD Layouts
      if: startsWith(matrix.target, 'netbsd-')
      uses: vmactions/netbsd-vm@v1
      with:
        usesh: true
        prepare: |
          pkg_add fpc libX11 libXext
        run: |
          if [ "${{ matrix.target }}" = "netbsd-i386" ]; then
            fpc -Pi386 -Tnetbsd -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas
          else
            fpc -Tnetbsd -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas
          fi

    # ==========================================
    # 6. OPENBSD VIRTUAL BUILD STEPS
    # ==========================================
    - name: Build on OpenBSD Layouts
      if: startsWith(matrix.target, 'openbsd-')
      uses: vmactions/openbsd-vm@v1
      with:
        usesh: true
        prepare: |
          pkg_add -I fpc libX11 libXext
        run: |
          fpc -Topenbsd -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    # ==========================================
    # 7. MACOS (DARWIN) HOST BUILD STEPS
    # ==========================================
    - name: Install FPC and X11 Dependencies on macOS Host
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install fpc xquartz fontconfig

    - name: Build on Darwin macOS Targets
      if: matrix.os == 'macos-latest'
      run: |
        if [ "${{ matrix.target }}" = "darwin-macos-aarch64" ]; then
          fpc -Paarch64 -Tdarwin -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas
        else
          fpc -Px86_64 -Tdarwin -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas
        fi
