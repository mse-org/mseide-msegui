name: Make

on:
  schedule:
    - cron:  '0 0 1 * *'
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          # Define each platform setup manually to keep the labels valid for GitHub
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: ubuntu-latest # Boots an Ubuntu runner to host the FreeBSD virtual machine
            target: freebsd

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    # --- LINUX COMPILATION TARGET ---
    - name: Build on Linux
      if: matrix.target == 'linux'
      shell: bash
      run: |
        set -xeuo pipefail
        sudo bash -c '
          apt-get update; apt-get -y install fpc
        ' >/dev/null
        fpc -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    # --- WINDOWS COMPILATION TARGET ---
    - name: Install Lazarus/FPC on Windows
      if: matrix.target == 'windows'
      uses: gcarreno/setup-lazarus@v3
      with:
        lazarus-version: stable

    - name: Add FPC binary path to Bash environment on Windows
      if: matrix.target == 'windows'
      shell: bash
      run: |
        FPC_DIR=$(find /c/ -maxdepth 4 -type d -name "i386-win32" -o -name "x86_64-win64" 2>/dev/null | head -n 1)
        if [ -n "$FPC_DIR" ]; then
          echo "$FPC_DIR" >> $GITHUB_PATH
        fi

    - name: Build on Windows
      if: matrix.target == 'windows'
      shell: bash
      run: |
        set -xeuo pipefail
        fpc -Fulib/common/* -Fulib/common/kernel/windows apps/ide/mseide.pas

    # --- FREEBSD COMPILATION TARGET ---
    - name: Build on FreeBSD
      if: matrix.target == 'freebsd'
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        prepare: |
          pkg update
          pkg install -y fpc libX11 libXext
        run: |
          fpc -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas
