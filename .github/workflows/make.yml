name: Make Ultimate Matrix OOTB

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 0 1 * *'
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- LINUX TARGETS ---
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-latest
            target: linux-i386
          - os: ubuntu-latest
            target: linux-rpi-arm32
          - os: ubuntu-latest
            target: linux-rpi-aarch64

          # --- WINDOWS TARGETS ---
          - os: windows-latest
            target: windows-x86_64
          - os: windows-latest
            target: windows-i386

          # --- FREEBSD TARGETS ---
          - os: ubuntu-latest
            target: freebsd-x86_64

          # --- MACOS (DARWIN) TARGETS ---
          - os: macos-latest
            target: darwin-macos-aarch64

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    # ==========================================
    # 1. LINUX HOST BUILD STEPS
    # ==========================================
    - name: Build on Linux x86_64
      if: matrix.target == 'linux-x86_64'
      run: |
        sudo apt-get update && sudo apt-get -y install fpc
        fpc -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    - name: Build on Linux i386 (Using Portable FPC-OOTB)
      if: matrix.target == 'linux-i386'
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get -y install unzip libc6:i386 libx11-dev:i386 libxext-dev:i386
        
        # Download verified raw binary asset zip directly from GitHub release storage stream
        curl -sL "https://github.com" -o fpc-ootb.zip
        mkdir -p fpc-linux32
        unzip -q fpc-ootb.zip -d fpc-linux32
        
        # Use an absolute wildcard execution link to safely catch nested directory schemas
        chmod +x fpc-linux32/fpc-ootb-*/fpc-ootb
        fpc-linux32/fpc-ootb-*/fpc-ootb -Tlinux -Pi386 -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    # ==========================================
    # 2. RASPBERRY PI EMULATED BUILD STEPS
    # ==========================================
    - name: Cache ARM32 OS Container Environment
      if: matrix.target == 'linux-rpi-arm32'
      uses: actions/cache@v4
      with:
        path: ~/.run-on-arch-cache
        key: run-on-arch-cache-armv7-v1

    - name: Build on Linux RPi ARM32
      if: matrix.target == 'linux-rpi-arm32'
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: armv7
        distro: ubuntu_latest
        githubToken: ${{ github.token }}
        run: |
          if ! command -v fpc &> /dev/null; then apt-get update && apt-get install -y fpc; fi
          fpc -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    - name: Cache AArch64 OS Container Environment
      if: matrix.target == 'linux-rpi-aarch64'
      uses: actions/cache@v4
      with:
        path: ~/.run-on-arch-cache
        key: run-on-arch-cache-aarch64-v1

    - name: Build on Linux RPi AArch64
      if: matrix.target == 'linux-rpi-aarch64'
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: aarch64
        distro: ubuntu_latest
        githubToken: ${{ github.token }}
        run: |
          if ! command -v fpc &> /dev/null; then apt-get update && apt-get install -y fpc; fi
          fpc -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    # ==========================================
    # 3. WINDOWS HOST BUILD STEPS
    # ==========================================
    - name: Install Lazarus/FPC on Windows (64-bit)
      if: matrix.target == 'windows-x86_64'
      uses: gcarreno/setup-lazarus@v3
      with:
        lazarus-version: stable

    - name: Add FPC binary path to Bash environment on Windows
      if: matrix.target == 'windows-x86_64'
      shell: bash
      run: |
        FPC_DIR=$(find /c/ -maxdepth 4 -type d -name "x86_64-win64" 2>/dev/null | head -n 1)
        if [ -n "$FPC_DIR" ]; then echo "$FPC_DIR" >> $GITHUB_PATH; fi

    - name: Build on Windows x86_64
      if: matrix.target == 'windows-x86_64'
      shell: bash
      run: |
        fpc -Twin64 -Fulib/common/* -Fulib/common/kernel/windows apps/ide/mseide.pas

    - name: Build on Windows i386 (Using Portable FPC-OOTB)
      if: matrix.target == 'windows-i386'
      shell: bash
      run: |
        # Download verified raw binary asset zip directly from GitHub release storage stream
        curl -sL "https://github.com/fredvs/freepascal-ootb/releases/download/3.2.2/fpc-ootb-324-i386-win32.zip" -o fpc-ootb-win32.zip
        mkdir -p fpc-win32
        unzip -q fpc-ootb-win32.zip -d fpc-win32
        
        # Locate the executable via robust wildcard evaluation strings to handle naming variations
        OOTB_WIN_BIN=$(find fpc-win32 -type f -name "fpc-ootb.exe" | head -n 1)
        "$OOTB_WIN_BIN" -Twin32 -Pi386 -Fulib/common/* -Fulib/common/kernel/windows apps/ide/mseide.pas

    # ==========================================
    # 4. FREEBSD VIRTUAL BUILD STEPS
    # ==========================================
    - name: Build on FreeBSD x86_64
      if: matrix.target == 'freebsd-x86_64'
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        prepare: pkg update && pkg install -y fpc libX11 libXext
        run: fpc -Tfreebsd -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas

    # ==========================================
    # 5. MACOS (DARWIN) HOST BUILD STEPS
    # ==========================================
    - name: Install FPC and X11 Dependencies on macOS Host
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install fpc xquartz fontconfig
        echo "/opt/homebrew/bin" >> $GITHUB_PATH
        echo "/usr/local/bin" >> $GITHUB_PATH

    - name: Build on Darwin macOS Targets
      if: matrix.os == 'macos-latest'
      run: |
        export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
        fpc -Paarch64 -Tdarwin -Fl/opt/X11/lib -Fulib/common/* -Fulib/common/kernel/linux apps/ide/mseide.pas
